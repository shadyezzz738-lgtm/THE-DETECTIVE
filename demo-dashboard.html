<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d19"><title>THE DETECTIVE — Dashboard Demo</title>
<style>
:root{--g:#e5bd70;--bg:#080d18;--p:#111b2b;--l:#2c3a50;--m:#93a1b7;--w:#edf1f7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 22% 15%,#253147,transparent 45%),radial-gradient(ellipse at 85% 80%,#241b31,transparent 40%),#060a12;color:var(--w);font-family:system-ui,"Segoe UI",Tahoma,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}.top{height:54px;margin:5px 10px;border:1px solid #39465a;border-radius:17px;background:#09101fee;display:flex;align-items:center;justify-content:space-between;padding:0 18px;direction:ltr;color:var(--g);font-size:12px}.top span{color:#c4cede}.layout{max-width:1400px;margin:18px auto;padding:0 18px 90px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:26px;align-items:start}.room{height:690px;position:relative;overflow:hidden;border:1px solid #414b5e;border-radius:18px;background:linear-gradient(180deg,#101827aa,#080c14ee),radial-gradient(ellipse at 50% 30%,#51505a,#151923 65%,#080b10);box-shadow:0 22px 60px #0009}.room:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 50%,#000b)}.window{position:absolute;top:90px;left:0;width:22%;height:210px;border:10px solid #111925;background:linear-gradient(140deg,#090f19,#28374a 50%,#080d16);box-shadow:inset 0 0 40px #000}.window:after{content:"";position:absolute;left:50%;height:100%;width:4px;background:#080d16}.lamp{position:absolute;top:0;left:52%;height:170px;width:130px;border-top:8px solid #070b12;display:flex;justify-content:center}.lamp:after{content:"";position:absolute;top:75px;width:110px;height:38px;border-radius:60% 60% 12px 12px;background:linear-gradient(#ffe5a0,#b98b43);box-shadow:0 0 75px 26px #e5bd7045}.clock{position:absolute;right:11%;top:90px;width:105px;height:105px;border:3px solid #a17c48;border-radius:50%;display:grid;place-items:center;background:#090f19;color:var(--g);font:13px Georgia}.clock:after{content:"";position:absolute;top:18px;left:51%;height:34px;width:2px;background:var(--g);transform:rotate(-52deg);transform-origin:bottom}.board{position:absolute;top:170px;left:23%;width:54%;height:230px;border:10px solid #3c3027;background:radial-gradient(#5a4a39,#28272a);box-shadow:0 15px 24px #0009;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px}.photo{border:4px solid #aaa08d;background:linear-gradient(145deg,#101827,#42454b);position:relative}.photo:before{content:"";position:absolute;inset:12px 18px 6px;background:#0b1019;border-radius:45% 45% 10% 10%}.photo:after{content:"";position:absolute;top:12px;left:calc(50% - 12px);width:24px;height:24px;border-radius:50%;background:#111722}.table{position:absolute;left:-3%;right:-3%;bottom:95px;height:120px;background:linear-gradient(#6b5540,#1a1b20 18%,#090d13);border-top:5px solid #8b7050;transform:perspective(500px) rotateX(8deg);box-shadow:0 -10px 28px #000}.chair{position:absolute;bottom:78px;width:18%;height:150px;border-radius:30px 30px 10px 10px;background:linear-gradient(100deg,#080b12,#393940,#090c13);border:2px solid #242832;z-index:2}.chair.a{left:18%}.chair.b{left:42%;height:165px}.chair.c{right:17%}.roomlabel{position:absolute;left:22px;bottom:20px;z-index:2;direction:ltr;color:#aab5c6;font-size:11px;letter-spacing:2px}.roomlabel b{color:var(--g)}.phone{position:sticky;top:14px;border:8px solid #303744;border-radius:42px;padding:9px;background:#070b12;box-shadow:0 0 0 2px #a18a61,0 25px 60px #000c;min-height:690px;overflow:hidden}.notch{width:112px;height:18px;background:#03060b;border-radius:0 0 14px 14px;margin:-9px auto 3px}.status{display:flex;justify-content:space-between;direction:ltr;color:#d5deed;font-size:11px;padding:3px 9px 9px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:#0d1421;border:1px solid #25324a;border-radius:12px;margin-bottom:12px}.tabs button{border:0;border-radius:8px;background:transparent;padding:9px;color:#7e8ba4;font-size:17px}.tabs button.active{color:var(--g);background:linear-gradient(#25324a,#111a2a);box-shadow:inset 0 -2px var(--g)}.screen{height:565px;overflow:auto;padding:0 2px 8px;scrollbar-width:thin}.heading{display:flex;justify-content:space-between;color:var(--g);font-size:12px;margin:12px 4px 8px}.heading small{color:#8390a6}.contact{width:100%;border:1px solid #29364b;border-radius:13px;background:linear-gradient(110deg,#172235,#0e1625);display:flex;align-items:center;gap:10px;padding:10px;margin:6px 0;text-align:right}.contact:hover{border-color:#b58c4e}.avatar{width:40px;height:40px;flex:none;border:1px solid #8d7044;border-radius:50%;display:grid;place-items:center;background:radial-gradient(#344158,#121a2a);font-size:18px;color:var(--g)}.ci{flex:1;min-width:0}.ci b{font-size:12px;display:block}.ci small{display:block;color:#91a0b6;font-size:10px;margin-top:4px}.arrow{color:var(--g)}.msgrow{display:flex;align-items:center;gap:9px;padding:11px 8px;border-bottom:1px solid #202b3e;font-size:11px;width:100%;background:none;border:0;text-align:right;color:inherit}.msgrow .avatar{width:34px;height:34px}.msgrow div:nth-child(2){flex:1}.msgrow small{display:block;color:#8492aa;margin-top:3px}.alert,.profile,.summon{padding:10px;border:1px solid #29364b;border-radius:12px;background:#111a2a;margin:7px 0;font-size:11px;line-height:1.8}.alert i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);margin-left:6px}.alert.red i{background:#ed665e}.detailhead{display:flex;align-items:center;gap:9px;padding:8px 4px 13px;border-bottom:1px solid #29364b}.back{background:none;border:0;color:var(--g);font-size:23px}.detailhead .avatar{width:47px;height:47px}.detailhead b{display:block;font-size:13px}.detailhead small{color:#91a0b6;font-size:10px}.profile p{margin:4px 0;color:#c6cfdd}.profile strong{color:var(--g)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.act{border:1px solid #8c7047;background:#1b2432;color:var(--g);border-radius:10px;padding:10px 4px;font-size:11px}.act.primary{background:linear-gradient(#e5bd70,#b58a49);color:#17120a;font-weight:800}.act.wide{grid-column:span 2}.chatbox{display:flex;flex-direction:column;gap:8px;padding:12px 3px;min-height:175px}.bubble{max-width:88%;padding:9px 11px;border-radius:12px;background:#1a2a40;color:#e1e8f3;font-size:11px;line-height:1.8;align-self:flex-start}.bubble.me{background:#214b3d;align-self:flex-end}.compose{display:flex;gap:6px;position:sticky;bottom:0;background:#090f1b;padding:8px 0}.compose input{min-width:0;flex:1;border:1px solid #34435a;background:#111c2d;color:white;border-radius:20px;padding:10px 12px;font-size:11px}.compose button{border:0;border-radius:50%;width:38px;background:var(--g);color:#17120a}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#172b26;border:1px solid #4e9978;color:#c9f2dd;padding:11px 16px;border-radius:12px;z-index:10;font-size:12px;max-width:90%;text-align:center}.call{position:absolute;inset:0;background:linear-gradient(#111b2c,#05080f);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.call .avatar{width:84px;height:84px;font-size:32px;margin-bottom:18px}.call h3{margin:0 0 6px}.call p{font-size:12px;color:#9eacc0}.call button{border:0;border-radius:50%;width:58px;height:58px;margin:25px 8px 0;background:#c74444;font-size:22px}.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:7px;background:#0a1020ed;border:1px solid #39445c;border-radius:17px;z-index:8}.nav button{border:0;background:none;color:#94a1b7;padding:9px 14px;border-radius:11px;font-size:11px}.nav button.active{background:#27271f;color:var(--g);box-shadow:inset 0 0 0 1px #9e7840}
@media(max-width:900px){.layout{grid-template-columns:1fr;max-width:650px;margin:10px auto;padding:0 12px 90px}.room{height:310px;order:2}.window{height:110px;top:35px}.lamp{transform:scale(.7);transform-origin:top}.clock{width:70px;height:70px;top:35px;font-size:9px}.clock:after{height:25px;top:12px}.board{top:100px;height:120px;padding:7px;border-width:6px}.photo{border-width:2px}.chair{height:70px;bottom:42px}.chair.b{height:80px}.table{height:55px;bottom:50px}.phone{position:relative;top:auto;order:1;max-width:390px;margin:auto;min-height:0}.screen{height:550px}.roomlabel{bottom:12px}.top{padding:0 9px;font-size:10px}.nav{width:calc(100% - 20px);justify-content:space-around}.nav button{padding:9px 8px}}
</style></head><body>
<header class="top"><div>▦　<span>DAY 3</span>　│　◷　<span>10:24 PM</span>　│　▰　<span>CASE #002</span></div><div>▮▮▮　▰　<span>78%</span></div></header>
<main class="layout"><section class="room"><div class="window"></div><div class="lamp"></div><div class="clock">10:24</div><div class="board"><i class="photo"></i><i class="photo"></i><i class="photo"></i><i class="photo"></i><i class="photo"></i><i class="photo"></i><i class="photo"></i><i class="photo"></i></div><div class="chair a"></div><div class="chair b"></div><div class="chair c"></div><div class="table"></div><div class="roomlabel">THE <b>DETECTIVE</b>　/　INVESTIGATION ROOM</div></section>
<aside class="phone"><div class="notch"></div><div class="status"><span>10:24</span><span>▮▮▮　▰</span></div><div class="tabs"><button class="active" data-tab="messages">▣</button><button data-tab="contacts">♟</button><button data-tab="case">▱</button></div><div class="screen" id="screen"></div></aside></main>
<nav class="nav"><button class="active" onclick="navTo('messages',this)">⌕ التحقيق</button><button onclick="navTo('case',this)">▰ ملف القضية</button><button onclick="navTo('contacts',this)">♟ الأشخاص</button><button onclick="toast('الإعدادات في النسخة الكاملة')">⚙ الإعدادات</button></nav>
<script>
const people=[
{name:"كريم منصور",role:"خطيب ندى",icon:"👨🏻",status:"متاح للاستجواب",alibi:"بيقول إنه فضل في الكافيه وبعدين راح بنزينة طريق إسكندرية.",motive:"خناقة كبيرة آخر ليلة ورفضها تكمّل الجواز.",statement:"اتخانقنا وسابتني. ماشفتهاش بعد كده، وربنا يعلم إني ماكنتش هأذيها.",first:"حضرتك، أنا قلت كل اللي عندي. ندى مشيت من الكافيه وأنا فضلت مكاني.",answers:[["الكافيه","أيوه فضلت في الكافيه لوحدي وهي مشيت."],["فين كنت","ركبت عربيتي وروحت طريق إسكندرية ووقفت في بنزينة."],["الخناقة","خفت يتهموني. كنت أحمق، بس ما أذيتهاش."]]},
{name:"دينا حسني",role:"صديقة ندى وشريكتها",icon:"👩🏻",status:"متاحة للاستجواب",alibi:"كانت في فرح ابن خالها طول الليل.",motive:"كملت البوتيك لوحدها بعد اختفاء ندى واستفادت.",statement:"ندى كانت أختي. أنا اللي شغّالة على القضية من 3 سنين عشان أعرف الحقيقة.",first:"أنا جاوبت على الأسئلة دي قبل كده. كنت في الفرح، وفيه فيديوهات تثبت ده.",answers:[["آخر مرة","الساعة 9:10 بعتتلي إنها هتقابل حد ضروري في المزرعة."],["مين قابل","لا، ماقالتش اسم. ولو كنت أعرف كنت قلت."],["البوتيك","كنا شركاء، وكملت الشغل بعد اختفائها. ده مش معناه إني أذيتها."]]},
{name:"عادل الشريف",role:"عم ندى ومدير المزرعة",icon:"👨🏽",status:"مطلوب للمواجهة",alibi:"بيقول إنه نام في بيته ومخرجش.",motive:"خلافات على إدارة أرض العيلة وأرباحها.",statement:"ندى بنت أخويا ومالهاش غيري. ربنا يعلم أنا مارحتش المزرعة الليلة دي.",first:"كفاية يا حضرة المحقق. أنا راجل كبير وعندي قلب، واللي حصل ماليش دعوة بيه.",answers:[["بوابة المزرعة","…آه، عدّيت. رحت أطمن على الشغالين ورجعت. ماقلتش عشان ماتتلخبطش الدنيا."],["عقد البيع","التوقيع ده؟ أكيد حد قلّدني! أنا ماليش دعوة."],["التسجيل الصوتي","الصوت مشوّش وماينفعش يتحسب دليل لوحده."]]},
{name:"سامي رشدي",role:"مدرس تصوير وصاحب استوديو",icon:"👨🏻‍🦱",status:"متاح للاستجواب",alibi:"كان في الاستوديو مع عميل لحد 9.",motive:"ندى كانت عارفة سرّ في الاستوديو.",statement:"ندى مشيت بعد الدرس الساعة 8 وماشفتهاش تاني.",first:"أنا مش فاهم ليه اسمي موجود هنا. أنا صاحب استوديو تصوير وبس.",answers:[["عقد بيع الأرض","…أنا طبعت العقد بس! قالولي أوراق عادية، وماعرفتش إنها هتبقى جريمة."],["آخر مرة","الساعة 8 بالليل بعد الدرس. كانت مبسوطة وماشية."],["اختفائها","عرفت من الأخبار، وماكنتش أعرف أساعد إزاي."]]}
];
let tab="messages",selected=-1,chats={},summons=[],timer=null;const screen=document.getElementById("screen");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s){let old=document.querySelector(".toast");if(old)old.remove();let d=document.createElement("div");d.className="toast";d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),2500)}
function setTab(t){tab=t;selected=-1;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render()}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
function navTo(t,b){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");setTab(t)}
function render(){if(selected>=0){detail();return}if(tab==="contacts"){screen.innerHTML='<div class="heading"><span>CONTACTS / المشتبه بهم</span><small>4 أشخاص مسجلين</small></div><p style="font-size:10px;color:#91a0b6;line-height:1.8;margin:0 4px 10px">اضغط على أي مشتبه به لفتح ملفه، مراسلته، الاتصال به أو استدعائه للتحقيق.</p>'+people.map((p,i)=>'<button class="contact" onclick="openPerson('+i+')"><span class="avatar">'+p.icon+'</span><span class="ci"><b>'+p.name+'</b><small>'+p.role+' · '+p.status+'</small></span><span class="arrow">‹</span></button>').join('')+summonHTML();return}
if(tab==="case"){screen.innerHTML='<div class="heading"><span>CASE FILE / ملف القضية</span><small>#002</small></div><div class="profile"><strong>المختفية: ندى الشريف</strong><p>اختفت من 3 سنين. موبايلها القديم اتلاقى مدفون جنب بئر في مزرعة العيلة. القضية اتفتحت من جديد.</p></div><div class="heading">EVIDENCE ALERTS</div><div class="alert red"><i></i> عقد بيع الأرض — توقيع ندى مزوّر والمستفيد الأول عادل.</div><div class="alert"><i></i> تسجيل بوابة الطريق — سيارة عادل دخلت المزرعة 10:50 م.</div><div class="alert"><i></i> تسجيل صوتي — صوت رجل يرجّح أنه عادل.</div><div class="heading">SUMMONS / الاستدعاءات</div>'+summonHTML();return}
screen.innerHTML='<div class="heading"><span>MESSAGES / الرسائل</span><small>CASE #002</small></div>'+people.map((p,i)=>'<button class="msgrow" onclick="openPerson('+i+')"><span class="avatar">'+p.icon+'</span><div><b>'+p.name+'</b><small>'+(chats[i]?.length?chats[i][chats[i].length-1].text:p.first)+'</small></div><small>›</small></button>').join('')+'<div class="heading">EVIDENCE ALERTS</div><div class="alert red"><i></i> New Evidence — عقد بيع مزوّر اتضاف لملف القضية.</div><div class="alert"><i></i> Camera Match — سيارة عادل ظهرت عند بوابة المزرعة.</div><div class="alert"><i></i> Audio Analysis — تطابق صوتي مبدئي.</div>'}
function summonHTML(){return summons.length?summons.map(s=>'<div class="summon"><b>📨 استدعاء: '+people[s.i].name+'</b><p>تم تسجيل طلب حضور إلى مقر التحقيق.<br>الحالة: '+(s.done?'تم تسجيل الاستدعاء':'في انتظار التأكيد')+'</p></div>').join(''):'<p style="font-size:10px;color:#8492aa">لا توجد استدعاءات حتى الآن.</p>'}
function openPerson(i){selected=i;detail()}
function closePerson(){selected=-1;render()}
function detail(){let p=people[selected],h=chats[selected]||[];screen.innerHTML='<div class="detailhead"><button class="back" onclick="closePerson()">›</button><span class="avatar">'+p.icon+'</span><div><b>'+p.name+'</b><small>'+p.role+'</small></div></div><div class="profile"><p><strong>الحالة:</strong> '+p.status+'</p><p><strong>العذر:</strong> '+p.alibi+'</p><p><strong>الدافع المحتمل:</strong> '+p.motive+'</p><p><strong>أقواله:</strong> '+p.statement+'</p></div><div class="actions"><button class="act" onclick="callPerson('+selected+')">☎ اتصال</button><button class="act primary" onclick="summon('+selected+')">📨 استدعاء للمقر</button><button class="act wide" onclick="document.getElementById(\\'message\\').focus()">💬 بدء محادثة</button></div><div class="heading"><span>SECURE CHAT / محادثة التحقيق</span><small>نسخة تجريبية</small></div><div class="chatbox" id="chatbox"><div class="bubble">'+esc(p.first)+'</div>'+h.map(m=>'<div class="bubble '+(m.me?'me':'')+'">'+esc(m.text)+'</div>').join('')+'</div><form class="compose" onsubmit="send(event)"><input id="message" autocomplete="off" placeholder="اكتب سؤالك للمشتبه به..."><button>➤</button></form>';let box=document.getElementById("chatbox");box.scrollTop=box.scrollHeight}
function answer(i,q){let p=people[i],low=q.toLowerCase(),found=p.answers.find(a=>low.includes(a[0].toLowerCase().slice(0,4)));if(found)return found[1];if(low.includes("فين")||low.includes("وقت")||low.includes("ساعة"))return p.alibi;if(low.includes("ليه")||low.includes("دافع"))return p.motive;if(low.includes("مين")||low.includes("ندى"))return p.statement;return p.first+" لو عندك دليل محدد واجهني بيه."}
function send(e){e.preventDefault();let input=document.getElementById("message"),q=input.value.trim();if(!q)return;let i=selected;(chats[i]??=[]).push({me:true,text:q});chats[i].push({me:false,text:answer(i,q)});detail()}
function summon(i){if(summons.some(s=>s.i===i)){toast("الاستدعاء موجود بالفعل في سجل القضية.");return}summons.push({i:i,done:false});detail();toast("تم تسجيل استدعاء "+people[i].name+" في ملف القضية التجريبي.")}
function callPerson(i){let p=people[i],ov=document.createElement("div");ov.className="call";ov.id="call";ov.innerHTML='<span class="avatar">'+p.icon+'</span><h3>'+p.name+'</h3><p>اتصال آمن عبر وحدة التحقيقات…</p><div id="callstate" style="color:#65c99a;font-size:12px">جاري الاتصال</div><button onclick="endCall()">✕</button>';document.querySelector(".phone").append(ov);timer=setTimeout(()=>{let s=document.getElementById("callstate");if(s)s.textContent="لم يتم الرد — يمكنك إرسال استدعاء بدلاً من ذلك."},4000)}
function endCall(){clearTimeout(timer);document.getElementById("call")?.remove();toast("انتهى الاتصال التجريبي — لا يتم إجراء مكالمة هاتفية حقيقية.")}
render();
</script></body></html>
